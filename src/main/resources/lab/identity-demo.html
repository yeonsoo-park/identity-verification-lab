<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>본인확인 실습 데모</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1e1e1e; --sub:#666; --line:#e3e5e8; --accent:#3b5bdb; --ok:#2b8a3e; --warn:#c92a2a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Apple SD Gothic Neo",sans-serif; }
  .banner { background:#343a40; color:#fff; padding:10px 16px; font-size:13px; text-align:center; }
  main { max-width:440px; margin:20px auto; padding:0 16px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  h2 { font-size:16px; margin:0 0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .muted { color:var(--sub); font-size:13px; }
  button, select { height:48px; border-radius:14px; border:1px solid var(--line); background:#fff; font-size:15px; font-weight:600; padding:0 16px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  button.block { width:100%; }
  .badge { display:inline-block; padding:4px 10px; border-radius:999px; font-size:13px; font-weight:700; }
  .badge.ok { background:#ebfbee; color:var(--ok); }
  .badge.no { background:#f1f3f5; color:var(--sub); }
  #log { font-family:ui-monospace,Menlo,monospace; font-size:12px; white-space:pre-wrap; max-height:260px; overflow:auto; background:#f8f9fa; border-radius:10px; padding:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="banner">개인 실습용 데모 화면 · 외부 인증은 로컬 모의 서버이며 실제 본인확인이 아닙니다</div>
<main>
  <section class="card">
    <h2>1. 테스트 회원 로그인</h2>
    <div class="row">
      <select id="userKey"><option>lab-user-a</option><option>lab-user-b</option><option>lab-user-c</option></select>
      <button id="loginBtn" class="primary">로그인</button>
      <button id="dropTokenBtn" title="세션 만료 상황 재현">토큰 버리기</button>
    </div>
    <p class="muted" id="who">로그인 전</p>
  </section>

  <section class="card hidden" id="signupPrompt">
    <h2>가입을 환영해요</h2>
    <p class="muted">본인확인은 선택이에요. 하지 않아도 서비스를 그대로 이용할 수 있어요.</p>
    <div class="row">
      <button class="primary" id="promptStart">지금 본인확인하기</button>
      <button id="promptSkip">나중에 할게요</button>
    </div>
  </section>

  <section class="card">
    <h2>2. 마이페이지 (GET /api/v1/members/me)</h2>
    <div id="mypage" class="muted">로그인하면 표시됩니다.</div>
  </section>

  <section class="card hidden" id="progress">
    <h2>3. 본인확인 진행 상태</h2>
    <div id="progressText" class="muted"></div>
    <div class="row" style="margin-top:12px">
      <button id="refreshBtn">결과 다시 확인</button>
      <button id="cancelBtn">본인확인 취소</button>
    </div>
  </section>

  <section class="card">
    <h2>요청·응답 로그</h2>
    <div id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} },
};
let pollTimer = null;
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function log(title, obj) {
  const line = `[${new Date().toLocaleTimeString()}] ${title}\n${obj ? JSON.stringify(obj, null, 2) : ''}\n`;
  $('log').textContent = line + $('log').textContent;
}

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  const token = store.get('accessToken');
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const json = await res.json().catch(() => ({}));
  log(`${method} ${path} → ${res.status}`, json);
  return { http: res.status, ...json };
}

async function login() {
  const key = $('userKey').value;
  const r = await api('POST', '/api/v1/auth/test-login', { testUserKey: key });
  if (r.http !== 200) return;
  store.set('accessToken', r.data.accessToken);
  $('who').textContent = `${r.data.name} 로 로그인됨 (isNewUser=${r.data.isNewUser})`;
  $('signupPrompt').classList.toggle('hidden', !r.data.isNewUser);   // 가입 직후 선택형 진입점
  await loadMe();
}

async function loadMe() {
  const r = await api('GET', '/api/v1/members/me');
  if (r.http === 401) { $('mypage').textContent = '로그인이 필요해요 (세션 만료). 같은 회원으로 다시 로그인하세요.'; return; }
  if (r.http !== 200) return;
  const d = r.data;
  const verified = d.identityVerificationStatus === 'VERIFIED';
  $('mypage').innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><b>${esc(d.name)}</b><div class="muted">${esc(d.email)} · ${esc(d.provider)}</div></div>
      ${verified
        ? `<span class="badge ok">본인확인 완료</span>`
        : `<span class="badge no">미확인</span>`}
    </div>
    <div style="margin-top:12px">
      ${verified
        ? `<p class="muted">완료 시각 ${esc(d.identityVerifiedAt.replace('T', ' '))}</p>`
        : `<button class="primary block" id="startBtn">본인확인하기</button>`}
    </div>`;
  if (!verified) $('startBtn').onclick = start;
}

async function start() {
  const r = await api('POST', '/api/v1/members/me/identity-verifications');
  if (r.http === 409) { await loadMe(); return; }
  if (r.http === 503) { showProgress('인증기관 연결이 원활하지 않아요. 잠시 후 다시 눌러주세요. (요청은 유지됩니다)'); return; }
  if (r.http !== 200 && r.http !== 201) return;
  store.set('verificationId', r.data.verificationId);
  if (r.data.authUrl) {
    location.href = r.data.authUrl;   // 모의 인증 화면으로 이동 → 끝나면 이 페이지로 돌아옴
  } else {
    showProgress('인증 화면 주소를 아직 받지 못했어요. 다시 시도해주세요.');
  }
}

function showProgress(text, pending = true) {
  $('progress').classList.remove('hidden');
  $('progressText').textContent = text;
  $('cancelBtn').classList.toggle('hidden', !pending);   // 종료된 요청에는 취소 버튼을 보이지 않는다
}

const STATUS_TEXT = {
  PENDING: '인증을 기다리는 중이에요.',
  SUCCEEDED: '본인확인이 완료됐어요.',
  FAILED: '본인확인에 실패했어요. 다시 시도할 수 있어요.',
  CANCELLED: '본인확인을 취소했어요. 계정은 미확인 상태로 유지돼요.',
  EXPIRED: '인증 유효시간이 지났어요. 다시 시도해주세요.',
};

async function checkStatus() {
  const id = store.get('verificationId');
  if (!id) return;
  const r = await api('GET', `/api/v1/members/me/identity-verifications/${id}`);
  if (r.http === 401) { showProgress('로그인이 만료됐어요. 같은 회원으로 다시 로그인한 뒤 "결과 다시 확인"을 눌러주세요.'); return; }
  if (r.http === 503 || r.http === 502) { showProgress('결과 확인이 지연되고 있어요. 자동으로 다시 확인할게요.'); schedule(); return; }
  if (r.http !== 200) { showProgress('요청을 찾을 수 없어요.'); store.set('verificationId', null); return; }
  showProgress(`${STATUS_TEXT[r.data.status]}${r.data.endReason ? ' (' + r.data.endReason + ')' : ''}`, r.data.status === 'PENDING');
  if (r.data.status === 'PENDING') { schedule(r.data.pollIntervalSeconds); return; }
  store.set('verificationId', null);
  await loadMe();
}

function schedule(sec = 2) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(checkStatus, sec * 1000);
}

async function cancel() {
  const id = store.get('verificationId');
  if (!id) return;
  clearTimeout(pollTimer);
  const r = await api('POST', `/api/v1/members/me/identity-verifications/${id}/cancel`);
  if (r.http === 200) {
    showProgress(STATUS_TEXT[r.data.status], false);
    store.set('verificationId', null);
    await loadMe();
  }
}

$('loginBtn').onclick = login;
$('dropTokenBtn').onclick = () => { store.set('accessToken', null); $('who').textContent = '토큰을 버렸어요 (세션 만료 재현)'; loadMe(); };
$('promptStart').onclick = () => { $('signupPrompt').classList.add('hidden'); start(); };
$('promptSkip').onclick = () => $('signupPrompt').classList.add('hidden');
$('refreshBtn').onclick = checkStatus;
$('cancelBtn').onclick = cancel;

// 모의 인증 화면에서 돌아온 경우: URL의 verificationId는 "어떤 요청인지"만 알려줄 뿐, 결과는 서버 조회로 확인한다
const returned = new URLSearchParams(location.search).get('verificationId');
if (returned) {
  store.set('verificationId', returned);
  history.replaceState(null, '', location.pathname);
}
if (store.get('accessToken')) { $('who').textContent = '저장된 토큰으로 로그인 상태'; loadMe(); }
if (store.get('verificationId')) checkStatus();
</script>
</body>
</html>
