<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard','Apple SD Gothic Neo',sans-serif; background:#fff; color:#1b1d22; width:1600px; height:1000px; overflow:hidden; }
.head { height:64px; background:#2F3242; color:#fff; display:flex; align-items:center; padding:0 28px; gap:0; font-size:15px; }
.head div { padding:0 22px; border-right:1px solid #4a4e62; height:64px; display:flex; flex-direction:column; justify-content:center; }
.head div:last-child { border-right:none; margin-left:auto; }
.head small { font-size:11px; color:#9aa1bf; letter-spacing:.04em; }
.head b { font-size:17px; }
.wrap { display:grid; grid-template-columns:560px 1fr; height:936px; }
.left { background:#F4F5F8; display:flex; align-items:center; justify-content:center; position:relative; border-right:1px solid #e3e6ee; }
.right { padding:30px 36px; overflow:hidden; }
/* wireframe phone */
.ph { width:360px; height:760px; border:3px solid #9aa0ad; border-radius:36px; background:#fff; position:relative; overflow:hidden; }
.sb { height:30px; font-size:11px; color:#888; display:flex; justify-content:space-between; padding:8px 20px 0; }
.nav { height:48px; display:flex; align-items:center; padding:0 18px; font-size:16px; font-weight:700; border-bottom:1px solid #eee; gap:10px; }
.box { background:#E9EBF0; border-radius:10px; }
.txt { font-size:14px; color:#333; line-height:1.5; }
.t1 { font-size:20px; font-weight:800; line-height:1.35; }
.mut { font-size:12px; color:#8a8f9a; line-height:1.5; }
.btn { height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
.btn.p { background:#5b5f6b; color:#fff; } .btn.s { background:#E9EBF0; color:#333; } .btn.l { border:1.5px solid #c5c9d3; color:#333; }
.bdg { display:inline-block; border-radius:999px; font-size:11px; font-weight:800; padding:3px 9px; background:#E9EBF0; color:#555; }
.dim { position:absolute; inset:0; background:rgba(30,32,40,.45); }
.sheet { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:22px 22px 0 0; padding:24px 22px 28px; }
.m { position:absolute; width:26px; height:26px; border-radius:50%; background:#E8453C; color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; z-index:5; box-shadow:0 0 0 3px #fff; }
.outline { position:absolute; border:2px dashed #E8453C; border-radius:8px; z-index:4; pointer-events:none; }
/* description */
.desc-title { font-size:22px; font-weight:800; margin-bottom:6px; }
.meta { font-size:14px; color:#6b7180; margin-bottom:18px; line-height:1.6; }
.meta b { color:#2F64F5; }
table { border-collapse:collapse; width:100%; font-size:14.5px; }
th { background:#F1F3F8; text-align:left; padding:9px 12px; font-weight:800; border-top:2px solid #2F3242; }
td { border-bottom:1px solid #e6e9f0; padding:9px 12px; vertical-align:top; line-height:1.5; color:#3a3f4b; }
td.no { width:44px; } td.no span { display:inline-flex; width:24px; height:24px; border-radius:50%; background:#E8453C; color:#fff; font-weight:800; font-size:13px; align-items:center; justify-content:center; }
td.it { width:150px; font-weight:700; color:#1b1d22; }
.pol { display:inline-block; font-size:12px; font-weight:800; color:#2F64F5; background:#EEF2FE; border-radius:5px; padding:1px 6px; margin-left:4px; }
.states { margin-top:18px; display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:10px; }
.st { border:1px solid #e3e6ee; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5; color:#3a3f4b; }
.st b { display:block; font-size:13px; color:#1b1d22; margin-bottom:2px; }
.note { margin-top:14px; font-size:13px; color:#8a8f9a; }
.ext { position:absolute; inset:30px 0 0 0; background:repeating-linear-gradient(45deg,#f2f3f6,#f2f3f6 12px,#eceef2 12px,#eceef2 24px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
